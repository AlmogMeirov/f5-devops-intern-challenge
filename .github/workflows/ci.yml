name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute test suite
        run: ./scripts/run-tests.sh

      # Images survive `docker compose down`, so the size of what CI just built
      # is recorded on every run (see RCA.md, bonus 1).
      - name: Report image sizes
        if: always()
        run: docker image ls --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'
