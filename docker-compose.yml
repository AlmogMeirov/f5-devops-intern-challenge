services:
  backend:
    build:
      context: ./backend
    # Published for local debugging: curl http://localhost:8080/health
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    # app.py runs as PID 1 and installs no SIGTERM handler; the kernel ignores
    # default-action signals for PID 1, so `docker stop` waited 10s and then
    # SIGKILLed it (exit 137). A tiny init (tini) as PID 1 forwards SIGTERM.
    init: true
    # The backend loads its config (one slow read per key) BEFORE it opens
    # its port, so "container started" != "ready to serve". Readiness is
    # defined by the service's own /health endpoint. Python is guaranteed to
    # exist in this image, so the probe doesn't depend on curl/wget.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 3
      # Failures during start_period don't count; the container turns
      # healthy on the first successful probe, so this is a ceiling, not a delay.
      start_period: 60s

  proxy:
    build:
      context: ./proxy
    # Published for local debugging: curl http://localhost:8081/nginx-health
    ports:
      - "8081:8080"
    depends_on:
      backend:
        condition: service_healthy
    # Runtime hardening - nginx runs as uid 101 and needs none of these:
    read_only: true            # immutable root filesystem...
    tmpfs:
      - /tmp                   # ...except a scratch dir for pid + temp files
    cap_drop:
      - ALL                    # no Linux capabilities (port 8080 needs none)
    security_opt:
      - no-new-privileges:true # block setuid/setcap privilege escalation
    healthcheck:
      # curl was removed from the image; busybox wget ships with Alpine.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 30s

  test-runner:
    build:
      context: ./test-runner
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      - PROXY_URL=http://proxy:8080
