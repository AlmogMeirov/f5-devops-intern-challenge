# Send nginx logs to the container's stdout/stderr so that
# `docker compose logs proxy` shows them on any base image.
error_log /dev/stderr warn;

# Running as an unprivileged user: the PID file must live somewhere that user
# can write. /tmp is a tmpfs in docker-compose.yml (the root fs is read-only).
pid /tmp/nginx.pid;

# One worker per CPU core instead of the single-worker default.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # Temp/buffer dirs default to /var/cache/nginx (root-owned); move them to
    # the writable tmpfs so nginx can start as a non-root user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Don't advertise the nginx version in the Server header / error pages.
    server_tokens off;

    # The API only serves small GET requests; reject large bodies early.
    client_max_body_size 1k;

    upstream app_backend {
        # "backend" is the Compose service name; Docker's embedded DNS resolves it
        # to the backend container. 127.0.0.1 would be the proxy container itself.
        server backend:8080;
    }

    server {
        # Unprivileged port: a non-root process can't bind <1024 on a default
        # Linux host / Kubernetes. Compose maps it; tests use PROXY_URL.
        listen 8080;
        server_name localhost;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location / {
            # The backend only implements GET; refuse other methods at the edge.
            limit_except GET {
                deny all;
            }

            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Fail fast instead of holding clients for the 60s defaults.
            proxy_connect_timeout 5s;
            proxy_read_timeout    15s;
        }

        # Exact match: answered by nginx itself, never forwarded.
        location = /nginx-health {
            # Probed every 2s by the healthcheck - keep it out of the logs.
            access_log off;
            default_type application/json;
            return 200 '{"proxy": "ok"}';
        }
    }
}
